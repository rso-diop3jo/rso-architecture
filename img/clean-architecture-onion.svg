<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" width="640" height="580" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Clean architecture – čebula</title>
  <desc id="d">Tri koncentrični obroči: Domain v jedru, Use cases okoli njega, Adapters in Web (API) v zunanjem obroču. Puščice kažejo samo navznoter.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4a6b"/>
    </marker>
  </defs>

  <!-- obroči -->
  <circle cx="320" cy="290" r="260" fill="#dbe7f7" stroke="#3b4a6b" stroke-width="2"/>
  <circle cx="320" cy="290" r="165" fill="#b9d3f0" stroke="#3b4a6b" stroke-width="2"/>
  <circle cx="320" cy="290" r="80"  fill="#8fb8e8" stroke="#3b4a6b" stroke-width="2"/>

  <!-- puščice navznoter (odvisnosti) -->
  <line x1="8"   y1="290" x2="236" y2="290" stroke="#3b4a6b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="632" y1="290" x2="404" y2="290" stroke="#3b4a6b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- zunanji obroč -->
  <g fill="#14213d" text-anchor="middle">
    <text x="320" y="86"  font-size="20" font-weight="700">Web (API)</text>
    <text x="320" y="108" font-size="13">dohodni promet</text>
    <text x="320" y="480" font-size="20" font-weight="700">Adapters</text>
    <text x="320" y="502" font-size="13">odhodni promet</text>

    <!-- srednji obroč -->
    <text x="320" y="190" font-size="20" font-weight="700">Use cases</text>
    <text x="320" y="210" font-size="13">primeri uporabe</text>

    <!-- jedro -->
    <text x="320" y="288" font-size="20" font-weight="700">Domain</text>
    <text x="320" y="308" font-size="13">osnovni classi</text>
  </g>
</svg>
